name: Trading bot

on:
  schedule:
    # Weekdays at 19:00 UTC = 2:00 PM Eastern in winter, 3:00 PM Eastern in summer.
    # GitHub can start scheduled runs late, so this leaves time before the 4:00 PM close.
    - cron: "0 19 * * 1-5"
  workflow_dispatch:
    # Lets you run it by hand from the Actions tab.
    inputs:
      dry_run:
        description: "Dry run (show the signal, don't connect or trade)"
        type: boolean
        default: true

concurrency:
  group: trading-bot  # never two runs at once

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python bot.py --dry-run
          else
            python bot.py
          fi
