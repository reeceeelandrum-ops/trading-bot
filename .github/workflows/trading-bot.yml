name: Trading bot

on:
  schedule:
    # Every 15 minutes, every day. Stocks are only checked while the market is open;
    # crypto is checked on every run. GitHub can start scheduled runs a few minutes late.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    # Lets you run it by hand from the Actions tab.
    inputs:
      dry_run:
        description: "Dry run (show the signal, don't connect or trade)"
        type: boolean
        default: true

concurrency:
  group: trading-bot  # never two runs at once

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Safety gate: if any rule test fails, this step fails and the bot does not trade.
      - name: Test rules
        run: python -m unittest discover -s tests -v

      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python bot.py --dry-run
          else
            python bot.py
          fi
